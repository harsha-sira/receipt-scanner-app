name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths: [pwa/**]   # only redeploy when pwa/ files change

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write config.js from secrets
        run: |
          cat > pwa/config.js << 'EOF'
          window.BILL_CONFIG = {
            CLIENT_ID:       "${{ secrets.GOOGLE_CLIENT_ID }}",
            GEMINI_API_KEY:  "${{ secrets.GEMINI_API_KEY }}",
            FOLDERS: [
              { name: "Groceries", id: "${{ secrets.FOLDER_ID_GROCERIES }}" },
              { name: "Utilities", id: "${{ secrets.FOLDER_ID_UTILITIES }}" },
              { name: "Medical",   id: "${{ secrets.FOLDER_ID_MEDICAL }}"   },
              { name: "Other",     id: "${{ secrets.FOLDER_ID_OTHER }}"     },
            ],
          };
          EOF

      - name: Upload pwa/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
